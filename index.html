<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#702d42"><meta name="description" content="Nectar Chinese – My Vocabulary Garden">
<link rel="manifest" href="manifest.json"><title>Nectar Chinese – My Vocabulary Garden</title>
<style>
:root{--wine:#702d42;--wine2:#93465b;--pink:#f4dce1;--pink2:#faedf0;--cream:#fff9ef;--paper:#fffdf8;--ink:#422b30;--muted:#92777d;--line:#ead9d5;--green:#71876e;--shadow:0 8px 24px #542b3712}
[data-theme="dark"]{--wine:#e3a1b2;--wine2:#c77c92;--pink:#55313f;--pink2:#382631;--cream:#211c20;--paper:#2b2429;--ink:#f7e9e7;--muted:#c4aab0;--line:#493740;--green:#a6c19b;--shadow:0 8px 24px #0004}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--wine);color:white;font-weight:650}button.secondary{background:var(--pink);color:var(--wine)}button.ghost{background:transparent;color:var(--wine);border:1px solid var(--line)}button.danger{background:#a63d4e}button:disabled{opacity:.45;cursor:not-allowed}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 93%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:var(--pink);display:grid;place-items:center;font-size:23px}.brand b{display:block;color:var(--wine);font-family:Georgia,serif;font-size:19px}.brand small{color:var(--muted);font-size:11px;letter-spacing:.08em}
.layout{display:grid;grid-template-columns:225px minmax(0,1fr);max-width:1440px;margin:auto}.sidebar{padding:20px 12px;border-right:1px solid var(--line);min-height:calc(100vh - 66px)}nav{display:grid;gap:5px;position:sticky;top:82px}.navbtn{text-align:left;background:transparent;color:var(--muted);font-weight:600;padding:10px 12px}.navbtn.active,.navbtn:hover{background:var(--pink2);color:var(--wine)}.navgroup{font-size:10px;color:var(--muted);letter-spacing:.13em;padding:14px 12px 4px;text-transform:uppercase}
main{padding:24px;min-width:0;max-width:1120px;width:100%;margin:auto}.mobile-nav{display:none}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}.eyebrow{color:var(--wine);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.page-head h1{font:clamp(25px,4vw,34px) Georgia,serif;margin:3px 0;color:var(--wine)}.page-head p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);min-width:0}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}.stat{font:28px Georgia,serif;color:var(--wine);margin-top:6px}.muted{color:var(--muted)}.tiny{font-size:12px}.pill{display:inline-flex;padding:4px 9px;border-radius:99px;background:var(--pink2);color:var(--wine);font-size:11px;font-weight:700}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.field{display:grid;gap:5px;margin:9px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea,input.search{width:100%;background:var(--cream);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline-color:var(--wine)}textarea{min-height:72px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:170px}.wordlist{display:grid;gap:9px}.word{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}.hanzi{font:26px Georgia,serif;color:var(--wine)}.word-actions{display:flex;gap:5px;flex-wrap:wrap}.word-actions button{padding:7px 9px;font-size:12px}.empty{text-align:center;padding:36px;color:var(--muted)}.progress{height:9px;background:var(--pink);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--wine2);border-radius:99px}.flash{min-height:280px;display:grid;place-items:center;text-align:center;background:linear-gradient(140deg,var(--pink2),var(--paper));border:1px dashed var(--wine2);border-radius:22px;padding:25px;cursor:pointer}.flash .big{font:clamp(42px,8vw,68px) Georgia,serif;color:var(--wine)}.flash .answer{font-size:18px;margin-top:8px}.choice{display:block;width:100%;text-align:left;background:var(--pink2);color:var(--ink);margin:8px 0}.choice:hover{outline:2px solid var(--wine2)}.choice.correct{background:#dcebd8;color:#284b2d}.choice.wrong{background:#f5d9dc;color:#762e3c}.bar{height:7px;background:var(--pink);border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.tablelike{width:100%;border-collapse:collapse}.tablelike td,.tablelike th{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.note{background:var(--pink2);border-left:3px solid var(--wine2);padding:12px;border-radius:8px;color:var(--ink)}.hidden{display:none!important}.flower{color:var(--wine2)}footer{text-align:center;color:var(--muted);font-size:11px;padding:24px}
@media(max-width:800px){.layout{display:block}.sidebar{display:none}main{padding:17px 14px 92px}.mobile-nav{display:flex;position:fixed;z-index:8;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));justify-content:space-around;overflow-x:auto}.mobile-nav button{background:transparent;color:var(--muted);padding:6px 9px;font-size:10px;white-space:nowrap}.mobile-nav button.active{color:var(--wine);background:var(--pink2)}.span3{grid-column:span 6}.span4{grid-column:span 6}.span8,.span6{grid-column:span 12}.page-head{align-items:center}.page-head p{font-size:12px}.word{align-items:flex-start}.word-actions{max-width:110px}.word-actions button{font-size:11px}.brand b{font-size:17px}}
@media(max-width:420px){.span3,.span4{grid-column:span 12}.two{grid-template-columns:1fr}.card{padding:14px}}
</style></head>
<body>
<header><div class="brand"><div class="logo">🌸</div><div><b>Nectar Chinese</b><small>MY VOCABULARY GARDEN</small></div></div><div class="row"><span class="pill" id="saveStatus">● Đã lưu</span><button class="ghost" id="themeBtn" aria-label="Đổi giao diện">☾</button></div></header>
<div class="layout"><aside class="sidebar"><nav id="sideNav"></nav></aside><main id="app"></main></div><nav class="mobile-nav" id="mobileNav"></nav><footer>Made with ♡ for your little Chinese-learning garden</footer>
<dialog id="wordDialog"><form method="dialog" id="wordForm" style="padding:20px;min-width:min(92vw,560px);max-height:85vh;overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:18px"><div class="row between"><h2 style="font:24px Georgia;color:var(--wine);margin:0" id="wordDialogTitle">Thêm từ mới</h2><button type="button" class="ghost" id="closeWord">✕</button></div><input type="hidden" id="wId"><div class="two"><div class="field"><label>Chữ Hán *</label><input id="wHanzi" required placeholder="你好"></div><div class="field"><label>Pinyin</label><input id="wPinyin" placeholder="nǐ hǎo"></div><div class="field"><label>Nghĩa tiếng Việt *</label><input id="wMeaning" required placeholder="xin chào"></div><div class="field"><label>Từ loại</label><input id="wType" placeholder="động từ, danh từ..."></div><div class="field"><label>Cấp HSK</label><select id="wHsk"><option>Chưa phân loại</option><option>HSK 1</option><option>HSK 2</option><option>HSK 3</option><option>HSK 4</option><option>HSK 5</option></select></div><div class="field"><label>Trạng thái</label><select id="wStatus"><option>Mới học</option><option>Đang học</option><option>Đã thuộc</option><option>Cần ôn</option></select></div></div><div class="field"><label>Cấu trúc ngữ pháp liên quan</label><input id="wGrammar"></div><div class="field"><label>Ví dụ tiếng Trung</label><input id="wExample"></div><div class="two"><div class="field"><label>Pinyin câu ví dụ</label><input id="wExPin"></div><div class="field"><label>Dịch câu ví dụ</label><input id="wExVi"></div></div><div class="field"><label>Ghi chú cá nhân</label><textarea id="wNote"></textarea></div><div class="row"><button type="submit">Lưu từ vựng</button><button type="button" class="secondary" id="cancelWord">Hủy</button></div></form></dialog>
<dialog id="grammarDialog"><form method="dialog" id="grammarForm" style="padding:20px;min-width:min(92vw,560px);max-height:85vh;overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:18px"><div class="row between"><h2 style="font:24px Georgia;color:var(--wine);margin:0">Grammar Notebook</h2><button type="button" class="ghost" id="closeGrammar">✕</button></div><input id="gId" type="hidden"><div class="field"><label>Tên cấu trúc *</label><input id="gName" required></div><div class="field"><label>Công thức</label><input id="gFormula"></div><div class="field"><label>Ý nghĩa & cách sử dụng</label><textarea id="gUse"></textarea></div><div class="field"><label>Cấp HSK</label><select id="gHsk"><option>Chưa phân loại</option><option>HSK 1</option><option>HSK 2</option><option>HSK 3</option><option>HSK 4</option><option>HSK 5</option></select></div><div class="field"><label>Ví dụ tiếng Trung</label><input id="gExample"></div><div class="two"><div class="field"><label>Pinyin</label><input id="gPin"></div><div class="field"><label>Dịch tiếng Việt</label><input id="gVi"></div></div><div class="field"><label>Lỗi thường gặp</label><textarea id="gMistakes"></textarea></div><div class="field"><label>Ghi chú cá nhân</label><textarea id="gNote"></textarea></div><button type="submit">Lưu cấu trúc</button></form></dialog>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DB='nectarChineseDB', STORE='words', GSTORE='grammar'; let db, words=[], grammar=[], page='home', flash={list:[],i:0,flipped:false}, game={items:[],i:0,score:0,wrong:0,started:false,answered:false,kind:'meaning'}, selectedHSK='Tất cả', searchTerm='';
const nav=[['home','⌂','Trang chủ'],['flash','▤','Flashcard'],['vocab','文','Kho từ vựng'],['HSK 1','一','HSK 1'],['HSK 2','二','HSK 2'],['HSK 3','三','HSK 3'],['HSK 4','四','HSK 4'],['HSK 5','五','HSK 5'],['grammar','✎','Grammar Notebook'],['games','♧','Games'],['review','↻','Từ cần ôn'],['stats','▥','Thống kê'],['settings','⚙','Cài đặt']];
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore(STORE,{keyPath:'id'});d.createObjectStore(GSTORE,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function all(store){return new Promise((res,rej)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{let t=db.transaction(store,'readwrite');t.objectStore(store).put(obj);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function del(store,id){return new Promise((res,rej)=>{let t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function refresh(){words=await all(STORE);grammar=await all(GSTORE);$('#saveStatus').textContent='● Đã lưu';}
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
function seed(){return [
['你好','nǐ hǎo','xin chào','cụm từ','HSK 1','你好！','Nǐ hǎo!','Xin chào!'],
['谢谢','xièxie','cảm ơn','động từ','HSK 1','谢谢你。','Xièxie nǐ.','Cảm ơn bạn.'],
['学习','xuéxí','học tập','động từ','HSK 1','我学习汉语。','Wǒ xuéxí Hànyǔ.','Tôi học tiếng Trung.'],
['朋友','péngyou','bạn bè','danh từ','HSK 2','他是我的朋友。','Tā shì wǒ de péngyou.','Anh ấy là bạn của tôi.'],
['认真','rènzhēn','nghiêm túc','tính từ','HSK 3','她学习很认真。','Tā xuéxí hěn rènzhēn.','Cô ấy học rất nghiêm túc.'],
['影响','yǐngxiǎng','ảnh hưởng','động từ/danh từ','HSK 4','天气会影响心情。','Tiānqì huì yǐngxiǎng xīnqíng.','Thời tiết có thể ảnh hưởng tâm trạng.'],
['逐渐','zhújiàn','dần dần','phó từ','HSK 5','他的中文逐渐进步。','Tā de Zhōngwén zhújiàn jìnbù.','Tiếng Trung của anh ấy dần tiến bộ.']
]}
async function seedIfEmpty(){if(words.length===0){for(let a of seed()){await put(STORE,{id:uid(),hanzi:a[0],pinyin:a[1],meaning:a[2],type:a[3],hsk:a[4],example:a[5],exPin:a[6],exVi:a[7],status:'Mới học',note:'',grammar:'',added:new Date().toISOString(),ease:0,interval:0,due:Date.now(),reviews:0,wrong:0})}}}
function navRender(){let html=nav.map(([id,ic,t],i)=>`<button class="navbtn ${page===id?'active':''}" data-page="${id}">${ic}　${t}</button>`).join('');$('#sideNav').innerHTML='<div class="navgroup">Vườn học tập</div>'+html;$('#mobileNav').innerHTML=nav.filter(x=>['home','flash','vocab','games','review','stats'].includes(x[0])).map(([id,ic,t])=>`<button class="${page===id?'active':''}" data-page="${id}">${ic}<br>${t}</button>`).join('');}
function head(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">✿ NECTAR CHINESE</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function statCard(label,n,desc){return `<div class="card span3"><div class="muted tiny">${label}</div><div class="stat">${n}</div><div class="muted tiny">${desc}</div></div>`}
function filtered(){return words.filter(w=>(page==='review'?isDue(w):true)&&(page.startsWith('HSK ')?w.hsk===page:true)&&(!searchTerm||[w.hanzi,w.pinyin,w.meaning,w.grammar,w.example,w.note].join(' ').toLowerCase().includes(searchTerm.toLowerCase()))&&(selectedHSK==='Tất cả'||w.hsk===selectedHSK))}
function isDue(w){return !w.due||w.due<=Date.now()||w.status==='Cần ôn'}
function wordRows(list){if(!list.length)return '<div class="empty">🌱 Chưa có từ nào ở đây. Hãy gieo từ đầu tiên nhé!</div>';return `<div class="wordlist">${list.map(w=>`<div class="word"><div style="min-width:0"><div class="hanzi">${esc(w.hanzi)} <span class="pill">${esc(w.hsk)}</span></div><div><b>${esc(w.pinyin)}</b> · ${esc(w.meaning)}</div><div class="muted tiny">${esc(w.type||'Chưa phân loại')} · ${esc(w.status)} · ${w.reviews||0} lần ôn</div></div><div class="word-actions"><button class="secondary" data-edit="${w.id}">Sửa</button><button class="ghost" data-copy="${w.id}">＋</button><button class="danger" data-delete="${w.id}">×</button></div></div>`).join('')}</div>`}
function renderHome(){let mastered=words.filter(w=>w.status==='Đã thuộc').length,due=words.filter(isDue).length,percent=words.length?Math.round(mastered/words.length*100):0;return head('Khu vườn từ vựng','Mỗi ngày một chút, tiếng Trung sẽ nở hoa 🌷','<button data-page="vocab">＋ Thêm từ</button>')+`<div class="grid">${statCard('TỔNG TỪ VỰNG',words.length,'Từ trong khu vườn')}${statCard('ĐÃ THUỘC',mastered,percent+'% kho từ')}${statCard('HÔM NAY CẦN ÔN',due,'Từ đến lịch ôn')}${statCard('NGỮ PHÁP',grammar.length,'Cấu trúc đã lưu')}<div class="card span8"><div class="row between"><b>🌱 Tiến độ làm chủ từ vựng</b><span class="pill">${percent}%</span></div><div class="progress" style="margin:14px 0"><i style="width:${percent}%"></i></div><div class="row between muted tiny"><span>${mastered} từ đã thuộc</span><span>${words.length-mastered} từ đang vun trồng</span></div></div><div class="card span4"><b>✿ Lời nhắc hôm nay</b><p class="muted tiny">Ôn một ít từ cũ trước khi học từ mới nhé. Kiên trì quan trọng hơn tốc độ.</p><button class="secondary" data-page="review">Bắt đầu ôn (${due})</button></div><div class="card span12"><div class="row between"><b>🌸 Vừa thêm gần đây</b><button class="ghost" data-page="vocab">Xem tất cả</button></div>${wordRows([...words].sort((a,b)=>b.added.localeCompare(a.added)).slice(0,4))}</div></div>`}
function renderVocab(){let list=filtered();return head(page==='review'?'Hôm nay cần ôn':page.startsWith('HSK ')?`Vườn ${page}`:'Kho từ vựng','Tìm kiếm, phân loại và chăm sóc từng từ của bạn','<button id="addWord">＋ Thêm từ</button>')+`<div class="toolbar"><input class="search" id="wordSearch" placeholder="Tìm chữ Hán, pinyin, nghĩa..." value="${esc(searchTerm)}"><select id="hskFilter"><option>Tất cả</option>${[1,2,3,4,5].map(n=>`<option ${selectedHSK==='HSK '+n?'selected':''}>HSK ${n}</option>`).join('')}<option>Chưa phân loại</option></select><select id="statusFilter"><option>Tất cả trạng thái</option>${['Mới học','Đang học','Đã thuộc','Cần ôn'].map(x=>`<option>${x}</option>`).join('')}</select><button class="secondary" id="importQuick">Nhập nhanh</button></div><div class="row between muted tiny" style="margin-bottom:10px"><span>${list.length} từ được hiển thị</span><span>Sắp xếp: <select id="sortWords"><option value="new">Mới thêm</option><option value="az">Chữ Hán A–Z</option><option value="hard">Khó nhớ trước</option></select></span></div><div id="wordRows">${wordRows(list)}</div>`}
function renderFlash(){return head('Flashcard Garden','Lật thẻ, nhớ sâu, tiến bộ mỗi ngày')+`<div class="grid"><div class="card span4"><b>Thiết lập buổi học</b><div class="field"><label>Mặt trước</label><select id="front"><option value="hanzi">Chữ Hán</option><option value="meaning">Nghĩa tiếng Việt</option><option value="pinyin">Pinyin</option></select></div><div class="field"><label>Bộ từ</label><select id="flashHsk"><option>Tất cả từ</option>${[1,2,3,4,5].map(n=>`<option>HSK ${n}</option>`).join('')}</select></div><div class="field"><label>Số lượng</label><select id="flashCount"><option>10</option><option>20</option><option>50</option><option value="all">Toàn bộ</option></select></div><label><input type="checkbox" id="hidePin"> Ẩn Pinyin</label><br><label><input type="checkbox" id="hideMeaning"> Ẩn nghĩa</label><p><button id="startFlash">Bắt đầu học</button></p></div><div class="card span8"><div class="row between"><b id="flashCountLabel">Sẵn sàng học chưa?</b><span class="pill" id="flashProgress">0 / 0</span></div><div class="progress" style="margin:10px 0 16px"><i id="flashBar" style="width:0%"></i></div><div class="flash" id="flashCard"><div><div class="muted">Chạm vào thẻ để lật</div><div class="big">春日学习</div><div class="answer">Một khu vườn mới đang chờ bạn</div></div></div><div class="row between" style="margin-top:14px"><button class="secondary" id="prevFlash">← Trước</button><button class="ghost" id="shuffleFlash">🔀 Trộn</button><button id="nextFlash">Tiếp →</button></div><div class="row" style="margin-top:12px"><button class="secondary" data-rate="easy">Dễ nhớ</button><button class="secondary" data-rate="normal">Bình thường</button><button class="secondary" data-rate="hard">Khó nhớ</button></div></div></div>`}
function renderGrammar(){return head('Grammar Notebook','Sổ tay cấu trúc ngữ pháp của riêng bạn','<button id="addGrammar">＋ Thêm cấu trúc</button>')+`<div class="toolbar"><input class="search" id="grammarSearch" placeholder="Tìm cấu trúc, công thức..."></div><div class="grid">${grammar.length?grammar.map(g=>`<div class="card span6"><div class="row between"><b style="color:var(--wine)">${esc(g.name)}</b><span class="pill">${esc(g.hsk)}</span></div><h3>${esc(g.formula)}</h3><p>${esc(g.use)}</p><div class="note">${esc(g.example)}<br><span class="muted tiny">${esc(g.pin)} · ${esc(g.vi)}</span></div><p class="tiny muted">Lỗi thường gặp: ${esc(g.mistakes||'—')}</p><div class="row"><button class="secondary" data-gedit="${g.id}">Sửa</button><button class="danger" data-gdel="${g.id}">Xóa</button></div></div>`).join(''):'<div class="card span12 empty">📖 Sổ ngữ pháp còn trống. Hãy lưu cấu trúc đầu tiên!</div>'}</div>`}
const gameNames=[['meaning','Đoán nghĩa','Nhìn chữ Hán, chọn nghĩa tiếng Việt'],['pinyin','Ghép Pinyin','Chọn cách đọc chính xác'],['match','Ghép chữ với nghĩa','Ghép các cặp tương ứng'],['blank','Điền từ còn thiếu','Hoàn thành câu ví dụ'],['memory','Đua trí nhớ','Ghi nhớ nhanh các từ'],['typepin','Viết Pinyin','Tự gõ Pinyin'],['typevi','Viết nghĩa','Tự nhập nghĩa tiếng Việt']];
function renderGames(){return head('Góc trò chơi','Học vui một chút, nhớ lâu thêm nhiều 🌼')+`<div class="grid">${gameNames.map(([id,n,d])=>`<div class="card span4"><div style="font-size:28px"> ${({'meaning':'🎯','pinyin':'🔤','match':'🧩','blank':'✍️','memory':'🧠','typepin':'⌨️','typevi':'💬'})[id]}</div><h3 style="color:var(--wine);margin:7px 0">${n}</h3><p class="muted tiny">${d}</p><button data-game="${id}">Chơi ngay →</button></div>`).join('')}<div class="card span12" id="gameArea"><div class="empty">Chọn một trò chơi để bắt đầu khuấy động trí nhớ nhé!</div></div><div class="card span12"><b>🏆 Thành tích gần đây</b><div id="gameHistory" class="muted tiny">Chưa có lượt chơi nào.</div></div></div>`}
function renderStats(){let counts=[1,2,3,4,5].map(n=>({h:'HSK '+n,c:words.filter(w=>w.hsk==='HSK '+n).length}));let total=words.length||1;return head('Bảng thống kê','Theo dõi khu vườn của bạn lớn lên mỗi ngày')+`<div class="grid">${statCard('TỔNG TỪ',words.length,'Từ đã lưu')}${statCard('ĐÃ THUỘC',words.filter(w=>w.status==='Đã thuộc').length,'Đã làm chủ')}${statCard('CẦN ÔN',words.filter(isDue).length,'Đến lịch ôn')}${statCard('NGỮ PHÁP',grammar.length,'Cấu trúc đã lưu')}<div class="card span6"><b>Phân bố theo cấp HSK</b>${counts.map(x=>`<div style="margin:12px 0"><div class="row between tiny"><span>${x.h}</span><b>${x.c}</b></div><div class="bar"><i style="width:${x.c/total*100}%"></i></div></div>`).join('')}</div><div class="card span6"><b>Trạng thái ghi nhớ</b>${['Mới học','Đang học','Đã thuộc','Cần ôn'].map(s=>{let c=words.filter(w=>w.status===s).length;return `<div style="margin:12px 0"><div class="row between tiny"><span>${s}</span><b>${c}</b></div><div class="bar"><i style="width:${c/total*100}%"></i></div></div>`}).join('')}</div><div class="card span12"><b>📅 Nhật ký học tập</b><p class="muted tiny">Tổng lượt ôn: ${words.reduce((a,w)=>a+(w.reviews||0),0)} · Tổng lần trả lời khó: ${words.reduce((a,w)=>a+(w.wrong||0),0)}</p><p class="note tiny">Mẹo: ôn đều mỗi ngày và đánh dấu độ khó trung thực để lịch ôn thích nghi tốt hơn.</p></div></div>`}
function renderSettings(){return head('Cài đặt khu vườn','Tùy chỉnh trải nghiệm và bảo vệ dữ liệu')+`<div class="grid"><div class="card span6"><b>🎨 Giao diện</b><div class="field"><label>Chế độ</label><select id="themeSelect"><option value="light">Light Mode</option><option value="dark">Dark Mode</option></select></div><div class="field"><label>Màu chủ đề</label><select id="accent"><option value="wine">Đỏ rượu vang & hồng</option><option value="plum">Mận chín</option><option value="sage">Xanh sage</option></select></div></div><div class="card span6"><b>💾 Sao lưu dữ liệu</b><p class="muted tiny">Xuất JSON để sao lưu toàn bộ từ vựng, lịch ôn và ngữ pháp. Hãy lưu file ở nơi an toàn.</p><div class="row"><button id="exportJSON">Xuất JSON</button><button class="secondary" id="exportCSV">Xuất CSV</button></div><div class="field"><label>Khôi phục từ JSON</label><input type="file" id="importJSON" accept=".json,application/json"></div><p class="tiny muted">Nhập dữ liệu sẽ hợp nhất theo ID, không xóa dữ liệu hiện có.</p></div><div class="card span6"><b>⚡ Nhập nhanh nhiều từ</b><p class="tiny muted">Mỗi dòng: chữ Hán | pinyin | nghĩa | HSK (ví dụ: HSK 1)</p><textarea id="bulkInput" placeholder="苹果 | píngguǒ | quả táo | HSK 1&#10;喜欢 | xǐhuan | thích | HSK 2"></textarea><button id="bulkAdd">Thêm các dòng</button></div><div class="card span6"><b>🌿 Quản lý dữ liệu</b><p class="tiny muted">Có thể xóa dữ liệu mẫu hoặc xóa toàn bộ kho. Thao tác xóa cần xác nhận.</p><button class="secondary" id="removeSamples">Xóa từ mẫu</button> <button class="danger" id="wipeAll">Xóa toàn bộ dữ liệu</button><p class="tiny muted">Dung lượng lưu trữ phụ thuộc trình duyệt và thiết bị. Nên xuất JSON định kỳ.</p></div><div class="card span12"><b>📲 Cài đặt trên Android</b><ol class="tiny muted"><li>Mở website bằng Chrome sau khi triển khai lên HTTPS hoặc localhost.</li><li>Chọn menu ⋮ → “Thêm vào màn hình chính” hoặc “Cài đặt ứng dụng”.</li><li>Mở ứng dụng từ biểu tượng Nectar Chinese. Service worker sẽ lưu vỏ ứng dụng để dùng offline.</li></ol><p class="note tiny">Dữ liệu IndexedDB gắn với trình duyệt trên thiết bị. Không xóa dữ liệu trang web nếu chưa sao lưu.</p></div></div>`}
function render(){navRender();let html=page==='home'?renderHome():page==='flash'?renderFlash():page==='grammar'?renderGrammar():page==='games'?renderGames():page==='stats'?renderStats():page==='settings'?renderSettings():renderVocab();$('#app').innerHTML=html;wire();}
function navigate(p){page=p;searchTerm='';selectedHSK='Tất cả';render();window.scrollTo(0,0)}
function openWord(w){$('#wordForm').reset();$('#wId').value=w?.id||'';$('#wordDialogTitle').textContent=w?'Sửa từ vựng':'Thêm từ mới';let map={wHanzi:'hanzi',wPinyin:'pinyin',wMeaning:'meaning',wType:'type',wHsk:'hsk',wStatus:'status',wGrammar:'grammar',wExample:'example',wExPin:'exPin',wExVi:'exVi',wNote:'note'};for(let [id,k] of Object.entries(map))$('#'+id).value=w?.[k]|| (k==='hsk'?'Chưa phân loại':k==='status'?'Mới học':'');$('#wordDialog').showModal()}
async function saveWord(e){e.preventDefault();let id=$('#wId').value||uid(),old=words.find(w=>w.id===id)||{};let obj={...old,id,hanzi:$('#wHanzi').value.trim(),pinyin:$('#wPinyin').value.trim(),meaning:$('#wMeaning').value.trim(),type:$('#wType').value.trim(),hsk:$('#wHsk').value,status:$('#wStatus').value,grammar:$('#wGrammar').value,example:$('#wExample').value,exPin:$('#wExPin').value,exVi:$('#wExVi').value,note:$('#wNote').value,added:old.added||new Date().toISOString(),due:old.due||Date.now(),reviews:old.reviews||0,wrong:old.wrong||0,interval:old.interval||0};await put(STORE,obj);$('#wordDialog').close();await refresh();render()}
function startFlash(){let h=$('#flashHsk').value;flash.list=words.filter(w=>h==='Tất cả từ'||w.hsk===h);let n=$('#flashCount').value;if(n!=='all')flash.list=flash.list.slice(0,Number(n));flash.i=0;flash.flipped=false;drawFlash()}
function drawFlash(){let w=flash.list[flash.i];if(!w){$('#flashCard').innerHTML='<div class="empty">Chưa có từ phù hợp. Hãy thêm từ vào kho nhé!</div>';return}let front=$('#front').value;let val=w[front]||w.hanzi;$('#flashCard').innerHTML=flash.flipped?`<div><div class="big">${esc(w.hanzi)}</div><div class="answer">${esc(w.pinyin)}<br><b>${esc(w.meaning)}</b></div><p class="tiny muted">${esc(w.type)} · ${esc(w.hsk)}</p>${w.grammar?`<p class="tiny">Ngữ pháp: ${esc(w.grammar)}</p>`:''}${w.example?`<div class="note">${esc(w.example)}<br>${esc(w.exPin)}<br>${esc(w.exVi)}</div>`:''}</div>`:`<div><div class="muted tiny">CHẠM ĐỂ LẬT</div><div class="big">${esc(val)}</div><div class="answer">${front==='hanzi'&&$('#hidePin').checked?'Pinyin đã ẩn':front==='hanzi'&&$('#hideMeaning').checked?'Nghĩa đã ẩn':'Hãy thử nhớ đáp án'}</div></div>`;$('#flashCountLabel').textContent='Đang học · '+(flash.i+1)+' / '+flash.list.length;$('#flashProgress').textContent=(flash.i+1)+' / '+flash.list.length;$('#flashBar').style.width=(flash.i+1)/flash.list.length*100+'%'}
async function rateWord(rate){let w=flash.list[flash.i];if(w){let days=rate==='easy'?Math.max(4,(w.interval||1)*2.5):rate==='normal'?Math.max(1,(w.interval||0)*1.5):0;w.interval=days;w.due=Date.now()+days*86400000;w.reviews=(w.reviews||0)+1;if(rate==='hard'){w.wrong=(w.wrong||0)+1;w.status='Cần ôn'}else if(rate==='easy')w.status='Đã thuộc';else w.status='Đang học';await put(STORE,w);await refresh()}flash.i=Math.min(flash.i+1,flash.list.length-1);flash.flipped=false;drawFlash()}
function startGame(kind){let pool=[...words];if(pool.length<2){$('#gameArea').innerHTML='<div class="empty">Cần ít nhất 2 từ trong kho để chơi game.</div>';return}game={kind,items:pool.sort(()=>Math.random()-.5).slice(0,Math.min(10,pool.length)),i:0,score:0,wrong:0,started:true,answered:false};drawGame()}
function drawGame(){let w=game.items[game.i];if(!w){$('#gameArea').innerHTML=`<div class="empty"><h2>🎉 Hoàn thành!</h2><div class="stat">${game.score} điểm</div><p>Đúng ${game.score} · Sai ${game.wrong}</p><button id="replay">Chơi lại</button></div>`;return}let opts=[w,...words.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);let prompt=game.kind==='pinyin'?w.hanzi:game.kind==='blank'?(w.example||`我喜欢${w.hanzi}。`).replace(w.hanzi,'____'):w.hanzi;let html=`<div class="row between"><b>${gameNames.find(x=>x[0]===game.kind)[1]}</b><span class="pill">${game.i+1}/${game.items.length} · ${game.score} điểm</span></div><div class="progress" style="margin:12px 0"><i style="width:${game.i/game.items.length*100}%"></i></div><div class="flash" style="min-height:150px"><div><div class="big">${esc(prompt)}</div><div class="muted tiny">${game.kind==='blank'?'Chọn từ phù hợp để điền vào câu':'Chọn đáp án đúng'}</div></div></div>`;if(game.kind==='typepin'||game.kind==='typevi'){html+=`<div class="field"><label>${game.kind==='typepin'?'Nhập Pinyin':'Nhập nghĩa tiếng Việt'}</label><input id="typedAnswer" placeholder="Câu trả lời của bạn"></div><button id="checkTyped">Kiểm tra</button>`}else if(game.kind==='memory'){html+=`<p class="note">Hãy ghi nhớ: ${game.items.slice(0,Math.min(5,game.items.length)).map(x=>x.hanzi+' = '+x.meaning).join(' · ')}</p><button id="memoryNext">Đã nhớ rồi</button>`}else{html+=opts.map(o=>`<button class="choice" data-answer="${o.id}">${esc(game.kind==='pinyin'?o.pinyin:o.meaning)}</button>`).join('')}html+=`<div id="gameFeedback" class="tiny muted" style="margin-top:10px"></div>`;$('#gameArea').innerHTML=html}
async function answerGame(id){if(game.answered)return;game.answered=true;let w=game.items[game.i],ok=id===w.id;if(ok)game.score++;else{game.wrong++;w.wrong=(w.wrong||0)+1;w.status='Cần ôn';await put(STORE,w);await refresh()}$('#gameFeedback').innerHTML=(ok?'🌟 Chính xác!':'🌱 Chưa đúng, không sao nhé!')+' Đáp án: <b>'+esc(game.kind==='pinyin'?w.pinyin:w.meaning)+'</b> · '+esc(w.hanzi);document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.answer===w.id)b.classList.add('correct');else if(b.dataset.answer===id)b.classList.add('wrong')});$('#gameFeedback').innerHTML+=`<p><button id="gameNext">Câu tiếp theo →</button></p>`}
function wire(){
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
$('#addWord')?.addEventListener('click',()=>openWord());$('#wordForm').onsubmit=saveWord;['closeWord','cancelWord'].forEach(id=>$('#'+id).onclick=()=>$('#wordDialog').close());
$('#wordRows')?.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;let w=words.find(x=>x.id===b.dataset.edit||x.id===b.dataset.copy||x.id===b.dataset.delete);if(b.dataset.edit)openWord(w);if(b.dataset.copy){openWord({...w,id:'',hanzi:w.hanzi+' (bản sao)'})}if(b.dataset.delete&&confirm('Xóa từ '+w.hanzi+'?')){await del(STORE,w.id);await refresh();render()}});
$('#wordSearch')?.addEventListener('input',e=>{searchTerm=e.target.value;$('#wordRows').innerHTML=wordRows(filtered())});$('#hskFilter')?.addEventListener('change',e=>{selectedHSK=e.target.value;$('#wordRows').innerHTML=wordRows(filtered())});$('#statusFilter')?.addEventListener('change',e=>{let l=filtered().filter(w=>e.target.value==='Tất cả trạng thái'||w.status===e.target.value);$('#wordRows').innerHTML=wordRows(l)});$('#sortWords')?.addEventListener('change',e=>{let l=filtered();if(e.target.value==='az')l.sort((a,b)=>a.hanzi.localeCompare(b.hanzi));if(e.target.value==='hard')l.sort((a,b)=>(b.wrong||0)-(a.wrong||0));if(e.target.value==='new')l.sort((a,b)=>b.added.localeCompare(a.added));$('#wordRows').innerHTML=wordRows(l)});
$('#startFlash')?.addEventListener('click',startFlash);$('#flashCard')?.addEventListener('click',()=>{flash.flipped=!flash.flipped;drawFlash()});$('#prevFlash')?.addEventListener('click',()=>{flash.i=Math.max(0,flash.i-1);flash.flipped=false;drawFlash()});$('#nextFlash')?.addEventListener('click',()=>{flash.i=Math.min(flash.list.length-1,flash.i+1);flash.flipped=false;drawFlash()});$('#shuffleFlash')?.addEventListener('click',()=>{flash.list.sort(()=>Math.random()-.5);flash.i=0;drawFlash()});document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rateWord(b.dataset.rate));
$('#addGrammar')?.addEventListener('click',()=>openGrammar());$('#closeGrammar')?.addEventListener('click',()=>$('#grammarDialog').close());$('#grammarForm').onsubmit=saveGrammar;$('#grammarSearch')?.addEventListener('input',e=>document.querySelectorAll('#app .grid .card.span6').forEach(c=>c.classList.toggle('hidden',!c.textContent.toLowerCase().includes(e.target.value.toLowerCase()))));
$('#app').addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.game)startGame(b.dataset.game);if(b.dataset.gedit)openGrammar(grammar.find(g=>g.id===b.dataset.gedit));if(b.dataset.gdel&&confirm('Xóa cấu trúc này?')){await del(GSTORE,b.dataset.gdel);await refresh();render()}});
$('#gameArea')?.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.answer)answerGame(b.dataset.answer);if(b.id==='gameNext'||b.id==='memoryNext'){game.i++;game.answered=false;drawGame()}if(b.id==='replay')startGame(game.kind);if(b.id==='checkTyped'){let w=game.items[game.i],v=$('#typedAnswer').value.trim().toLowerCase(),target=(game.kind==='typepin'?w.pinyin:w.meaning).toLowerCase();answerGame(v===target?w.id:'wrong')}});
$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');$('#themeSelect')?.addEventListener('change',e=>setTheme(e.target.value));$('#accent')?.addEventListener('change',e=>{let c={wine:['#702d42','#f4dce1'],plum:['#603b68','#eadcf0'],sage:['#526f5c','#dce9dd']}[e.target.value];document.documentElement.style.setProperty('--wine',c[0]);document.documentElement.style.setProperty('--pink',c[1])});
$('#exportJSON')?.addEventListener('click',exportJSON);$('#exportCSV')?.addEventListener('click',exportCSV);$('#importJSON')?.addEventListener('change',importJSON);$('#bulkAdd')?.addEventListener('click',bulkAdd);$('#importQuick')?.addEventListener('click',()=>navigate('settings'));$('#removeSamples')?.addEventListener('click',async()=>{if(confirm('Xóa các từ mẫu ban đầu?')){for(let w of words.filter(w=>w.sample))await del(STORE,w.id);/* starter entries identified by exact sample vocabulary */for(let w of words.filter(w=>['你好','谢谢','学习','朋友','认真','影响','逐渐'].includes(w.hanzi)))await del(STORE,w.id);await refresh();render()}});$('#wipeAll')?.addEventListener('click',async()=>{if(confirm('Xóa TOÀN BỘ từ vựng và ngữ pháp? Hãy xuất JSON trước khi tiếp tục.')){for(let w of words)await del(STORE,w.id);for(let g of grammar)await del(GSTORE,g.id);await refresh();render()}})
}
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('nectarTheme',t);let s=$('#themeSelect');if(s)s.value=t}
function openGrammar(g){$('#grammarForm').reset();$('#gId').value=g?.id||'';let m={gName:'name',gFormula:'formula',gUse:'use',gHsk:'hsk',gExample:'example',gPin:'pin',gVi:'vi',gMistakes:'mistakes',gNote:'note'};for(let [id,k] of Object.entries(m))$('#'+id).value=g?.[k]|| (k==='hsk'?'Chưa phân loại':'');$('#grammarDialog').showModal()}
async function saveGrammar(e){e.preventDefault();let id=$('#gId').value||uid();let obj={id,name:$('#gName').value,formula:$('#gFormula').value,use:$('#gUse').value,hsk:$('#gHsk').value,example:$('#gExample').value,pin:$('#gPin').value,vi:$('#gVi').value,mistakes:$('#gMistakes').value,note:$('#gNote').value};await put(GSTORE,obj);$('#grammarDialog').close();await refresh();render()}
function download(name,data,type){let blob=new Blob([data],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportJSON(){download('nectar-chinese-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),words,grammar},null,2),'application/json')}
function exportCSV(){let keys=['hanzi','pinyin','meaning','type','hsk','grammar','example','exPin','exVi','note','status','added'];let q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('nectar-vocabulary.csv',[keys.join(','),...words.map(w=>keys.map(k=>q(w[k])).join(','))].join('\n'),'text/csv;charset=utf-8')}
async function importJSON(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.words)||!Array.isArray(d.grammar))throw Error('Sai định dạng');for(let w of d.words)if(w.id&&w.hanzi)await put(STORE,w);for(let g of d.grammar)if(g.id&&g.name)await put(GSTORE,g);await refresh();render();alert('Đã nhập dữ liệu thành công!')}catch(err){alert('Không thể nhập file: '+err.message)}e.target.value=''}
async function bulkAdd(){let lines=$('#bulkInput').value.split('\n').filter(x=>x.trim());let n=0;for(let line of lines){let [hanzi,pinyin,meaning,hsk='Chưa phân loại']=line.split('|').map(x=>x.trim());if(!hanzi||!meaning)continue;if(words.some(w=>w.hanzi===hanzi&&w.meaning===meaning))continue;await put(STORE,{id:uid(),hanzi,pinyin,meaning,hsk:/^HSK [1-5]$/.test(hsk)?hsk:'Chưa phân loại',status:'Mới học',added:new Date().toISOString(),due:Date.now(),reviews:0,wrong:0,interval:0});n++}await refresh();alert('Đã thêm '+n+' từ (bỏ qua dòng trùng hoặc thiếu dữ liệu).');navigate('vocab')}
(async()=>{try{db=await openDB();await refresh();await seedIfEmpty();await refresh();let theme=localStorage.getItem('nectarTheme')||'light';setTheme(theme);render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){$('#app').innerHTML='<div class="card">Không thể khởi tạo kho dữ liệu. Hãy mở bằng trình duyệt hiện đại qua HTTPS hoặc localhost.</div>'}})();
</script></body></html>
